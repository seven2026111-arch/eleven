  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  header{padding:24px 32px 12px;border-bottom:1px solid var(--border);}
  header h1{margin:0 0 4px;font-size:22px;}
  header p{margin:0;color:var(--sub);font-size:13px;}
  nav{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;}
  nav button{background:none;border:none;color:var(--sub);padding:14px 18px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
  main{padding:24px 32px 60px;max-width:1280px;margin:0 auto;}
  .tab{display:none;}
  .tab.active{display:block;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .card .label{color:var(--sub);font-size:12px;margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:600;}
  .card .delta{font-size:12px;margin-top:6px;}
  .up{color:var(--good);} .down{color:var(--bad);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
  .panel h3{margin:0 0 14px;font-size:15px;color:var(--text);}
  .panel h3 .sub{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--sub);font-weight:500;font-size:12px;}
  tr:hover{background:var(--panel2);}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;margin-left:6px;}
  .tag.lead{background:#4f9dff22;color:var(--accent);}
  .tag.new{background:#f6c45322;color:var(--warn);}
  .tag.flag{background:#f8717122;color:var(--bad);}
  .note{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  ul.concl{margin:0;padding-left:20px;line-height:1.9;font-size:13.5px;}
  ul.concl li{margin-bottom:6px;}
  .chart-box{position:relative;height:320px;}
  .badge-rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);font-size:11px;color:var(--sub);margin-right:6px;}
  .rank1{background:#f6c45333;color:var(--warn);}
  .rank2{background:#8b96a533;color:var(--text);}
  .rank3{background:#cd7f3233;color:#cd7f32;}
  .em{color:var(--accent);font-weight:600;}
  .dash{color:var(--sub);}

        <li>朱梦娣在W1、王洁茹(大可)在W2-W4、Vicky在W4均出现接待量为0的情况，<span class="em">结合排班核实为兼职工时安排导致，非数据异常</span>，不作为绩效问题标记。</li>
      </ul>

  `;
  destroyChart('ov');
  charts['ov'] = new Chart(document.getElementById('ovChart'), {

    rows += `<tr>
      <td>${PLABEL[prev.p]} → ${PLABEL[cur.p]}</td>
      <td>${fmtNum(prev.recv)} → ${fmtNum(cur.recv)}</td>
      <td class="${rd>=0?'up':'down'}">${rd>=0?'▲':'▼'} ${Math.abs(rd)}%</td>

  destroyChart('trRecv'); destroyChart('trSales');

/* ---------- 5. 个人表现排名 ---------- */
function renderAgents(){
  const el = document.getElementById('agents');
  const sel = document.createElement('div');
  // 四周累计聚合
  const agg = AGENTS.map(a=>{
    let recv=0, sales=0, geW=0, geT=0, qiW=0, qiT=0, satVals=[];
    PERIODS.forEach(p=>{
      const d = DATA[p][a];
      recv += d.total; sales += d.sales;
      if(d.geweix_timely!=null && d.geweix>0){ geT += d.geweix_timely*d.geweix; geW += d.geweix; }
      if(d.qiweix_resp!=null && d.qiweix>0){ qiT += d.qiweix_resp*d.qiweix; qiW += d.qiweix; }
      if(d.satisfaction!=null) satVals.push(d.satisfaction);
    });
    return {
      name:a, recv, sales,
      eff: recv>0 ? sales/recv : null,
      geTimely: geW? geT/geW : null,
      qiResp: qiW? qiT/qiW : null,
      sat: satVals.length? satVals.reduce((s,v)=>s+v,0)/satVals.length : null
    };
  });
  function rankOf(list, key, asc=false){
    const sorted = [...list].filter(x=>x[key]!=null).sort((a,b)=> asc ? a[key]-b[key] : b[key]-a[key]);
    const m = {}; sorted.forEach((x,i)=>m[x.name]=i+1); return m;
  }
  const rRecv = rankOf(agg,'recv');
  const rSales = rankOf(agg,'sales');
  const rEff = rankOf(agg,'eff');
  const rSat = rankOf(agg,'sat');
  const rResp = rankOf(agg,'qiResp', true);

  function badge(n){ if(!n) return '<span class="dash">—</span>'; const cls = n===1?'rank1':n===2?'rank2':n===3?'rank3':''; return `<span class="badge-rank ${cls}">${n}</span>`; }

  const rows = agg.map(a=>`
    <tr>
      <td>${a.name}<span class="tag ${ROLE[a.name]==='组长'?'lead':(ROLE[a.name]==='兼职(新)'?'new':'')}">${ROLE[a.name]}</span></td>
      <td>${fmtNum(a.recv)} ${badge(rRecv[a.name])}</td>
      <td>${fmtMoney(a.sales)} ${badge(rSales[a.name])}</td>
      <td>${fmtEff(a.eff)} ${badge(rEff[a.name])}</td>
      <td>${a.sat!=null?fmtPct(a.sat):'<span class="dash">—</span>'} ${badge(rSat[a.name])}</td>
      <td>${fmtSec(a.qiResp)} ${badge(rResp[a.name])}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="panel">
      <h3>客服四周累计综合表现与排名 <span class="sub">排名圆圈：1=金 2=银 3=铜</span></h3>
      <table>
        <thead><tr><th>客服</th><th>接待量</th><th>销售额</th><th>人效(¥/接待)</th><th>有赞满意度</th><th>企微平均响应</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="panel">
      <h3>客服综合排名（接待/销售/人效）</h3>
      <div class="chart-box" style="height:380px;"><canvas id="agChart"></canvas></div>
    </div>
    <div class="panel">
      <h3>响应效率 vs 满意度关系</h3>
      <ul class="concl">
        <li>有赞综合满意度数据多数周次缺失（绝大部分客服显示"—"），<span class="em">系客户未主动评价所致，非数据采集问题</span>，仅吕晨在W1获得一条100%满意度记录，样本量不足以支撑横向满意度排名，建议后续跟进有赞满意度评价的触达率。</li>
        <li>从可比的响应效率看：<b>吕晨、张胜男</b>企微平均响应时间稳定在25-35分钟区间，响应快、转化效果同步领先，呈现"响应快且销售效率高"的良性组合。</li>
        <li><b>黄桥、王璇</b>企微平均响应时间长期处于70-180分钟高位，且销售人效偏低，呈现"响应慢、转化弱"的待改善组合，建议作为重点辅导对象，排查响应延迟的具体环节（话术准备、多平台切换、工时安排等）。</li>
        <li>组长<b>李亚飞</b>个微及时响应率、有赞响应速度均处于团队中上水平，体现出在有限接待量下仍保持较高响应质量。</li>
      </ul>
    </div>
  `;
  destroyChart('ag');
  const validAgg = agg.filter(a=>a.recv>0);
  charts['ag'] = new Chart(document.getElementById('agChart'), {
    type:'bar',
    data:{
      labels: validAgg.map(a=>a.name),
      datasets:[
        {label:'接待量排名(越低越好)', data: validAgg.map(a=>rRecv[a.name]||AGENTS.length), backgroundColor:'#4f9dff'},
        {label:'销售额排名(越低越好)', data: validAgg.map(a=>rSales[a.name]||AGENTS.length), backgroundColor:'#34d399'},
        {label:'人效排名(越低越好)', data: validAgg.map(a=>rEff[a.name]||AGENTS.length), backgroundColor:'#f6c453'}
      ]
    },
    options:{responsive:true, maintainAspectRatio:false,
      scales:{y:{reverse:false, beginAtZero:true, grid:{color:'#2a3441'}, ticks:{color:'#8b96a5', stepSize:1}}, x:{ticks:{color:'#8b96a5'}}},
      plugins:{legend:{labels:{color:'#e8edf3'}}, tooltip:{callbacks:{label:(c)=>c.dataset.label+': 第'+c.raw+'名'}}}
    }
  });
}
