<style>
:root{

}
*{box-sizing:border-box;}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);}
header{background:linear-gradient(120deg,#3d4fe0,#7c5cff);color:#fff;padding:28px 32px;}

header p{margin:0;opacity:.9;font-size:13px;}
.tabs{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:10;}
.tab-btn{padding:14px 16px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--sub);white-space:nowrap;border-bottom:3px solid transparent;font-weight:500;}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border-radius:14px;padding:18px 20px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,20,50,.03);}
.kpi .label{font-size:12.5px;color:var(--sub);margin-bottom:8px;}
.kpi .value{font-size:26px;font-weight:700;}
.kpi .delta{font-size:12.5px;margin-top:6px;font-weight:600;}
.up{color:var(--bad);} .down{color:var(--good);} .flat{color:var(--sub);}
.section-title{font-size:16px;font-weight:700;margin:26px 0 12px;padding-left:10px;border-left:4px solid var(--brand);}
.card h3{margin:0 0 12px;font-size:14.5px;}
.chart-box{position:relative;height:320px;}
.chart-box.tall{height:400px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);}
th:first-child,td:first-child{text-align:left;}
th{color:var(--sub);font-weight:600;font-size:12.5px;background:#fafbff;}
tr:hover td{background:#f8f9ff;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.gold{background:#fff4d6;color:#a15c00;}
.tag.silver{background:#eef0f5;color:#556;}
.tag.bronze{background:#ffe8d9;color:#a4460b;}
.note{background:#fff8e6;border:1px solid #ffe3a3;border-radius:10px;padding:12px 16px;font-size:13px;color:#7a5400;margin:14px 0;line-height:1.7;}
.note.info{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;}
.callout{background:#f6f7fd;border-radius:12px;padding:16px 18px;margin:10px 0;border:1px solid var(--line);}
.callout h4{margin:0 0 8px;font-size:14px;}
.callout p{margin:0;font-size:13.5px;line-height:1.8;color:#333;}
ul.rec{margin:8px 0 0;padding-left:20px;}
ul.rec li{margin-bottom:10px;font-size:13.5px;line-height:1.7;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.small{font-size:12px;color:var(--sub);}
.pill{padding:3px 10px;border-radius:20px;background:#eef1ff;color:var(--brand);font-size:12px;font-weight:600;}
.pill.warn{background:#fff2e0;color:var(--warn);}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}.grid.g3{grid-template-columns:repeat(1,1fr);}.grid.g2{grid-template-columns:1fr;}}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px;}
</style>
</head>

<script>
// ============ 工具函数 ============
const fmtInt = n => n===null||n===undefined ? '—' : Math.round(n).toLocaleString('zh-CN');
const fmtMoney = n => n===null||n===undefined ? '—' : '¥' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtPct = n => n===null||n===undefined ? '—' : n.toFixed(1)+'%';
const fmtSec = n => n===null||n===undefined ? '—' : n.toFixed(1)+'秒';
const fmtEff = n => n===null||n===undefined ? '—' : n.toFixed(2);
const fmtDelta = n => {
  if(n===null||n===undefined) return '<span class="flat">无对比基础</span>';
  const cls = n>0 ? 'up' : (n<0 ? 'down' : 'flat');
  const sign = n>0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(1)}%</span>`;
};
const COLORS = ['#4f6bfd','#7c5cff','#22c1c3','#f59e0b','#ef4444','#10b981','#8b5cf6','#ec4899','#0ea5e9','#84cc16'];

const apr = DATA.apr, jun = DATA.jun, mom = DATA.mom, team = DATA.team;
// agents with data present in a given period
const aprAgents = agents.filter(a=>apr[a]);
const junAgents = agents.filter(a=>jun[a]);

  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

      说明企微渠道的实际服务承载能力并未随6月整体销售额下滑而减弱，反而有所增长，建议在下月数据补齐后进一步验证这一趋势是否延续。</p>
    </div>
    <div class="callout">
      <h4>3. 销售结构从"双核依赖"转向相对分散，但绝对规模仍需提振</h4>
      <p>4月吕晨、张胜男两位全职客服合计贡献约89.4%的团队销售额，集中度极高；6月降至58.9%，Vicky、肖佳怡、黄桥等客服的销售贡献占比有所提升，
      团队销售不再高度依赖两位核心客服，结构上更健康，但6月团队销售额绝对值仍处于低位，建议在保持结构分散化的同时，针对性提升各客服的转化能力以拉动整体规模。</p>
    </div>
    <div class="callout">
      <h4>4. 仍存在待核实的数据缺口与个别异常点</h4>
      <p>（1）6月有赞满意度数据除吕晨外全部缺失，需核实有赞后台评价数据同步状态；
      （2）Vicky、肖佳怡、王洁茹(大可)、王璇6月企微首响/平响数据缺失，需核实是否为6/24系统升级过渡期导致的统计中断；
      （3）张胜男4月企微首响长达342秒，为明显异常点，建议核查具体会话记录；
      （4）王洁茹(大可)、朱梦娣两月有赞销售额持续为0，王璇有赞接待量为0，三人均疑似存在有赞账号权限未开通问题，建议优先核实处理。</p>
    </div>
    <div class="callout">
      <h4>5. 新人培养、离职交接与组长角色需差异化看待</h4>
      <p>王璇、王洁茹(大可)为6月新入组客服，均无4月数据可比，建议作为独立培养基线观察；
      万紫欣已于4月8日离职，其4月数据仅为部分月数据，不宜作为典型月度参考；
      李亚飞作为组长承担团队管理与协调职责，个人接待量、销售额指标天然低于全职客服，建议在考核中单列或加权处理。</p>
    </div>

    <div class="section-title">私域客服团队优化建议</div>
    <div class="card">
      <ul class="rec">
        <li><b>建议一：以非活动月数据为常态KPI基准，活动月单独设立加成目标。</b>
        本次以4月为基准得到的接待量环比（-6.9%）比此前5月基准（-35.0%）更接近团队日常真实表现，建议后续固定采用月内无重大促销活动的周期作为常态基准，
        活动月则单独设立阶段性加成目标，避免用活动峰值或活动退坡数据误判团队常态表现。</li>

        <li><b>建议二：聚焦6月转化率下滑本身，复盘非活动期的成交路径与话术。</b>
        鉴于剔除活动因素后销售额环比仍下降78.2%，而接待量、企微日均服务量均保持稳定甚至提升，说明问题更多出在"进店到成交"的转化环节而非接待能力，
        建议复盘6月非活动期的产品介绍、促单节点设计，并结合销售结构分散化的趋势，为Vicky、肖佳怡、黄桥等销售占比提升的客服提供更多转化技巧支持。</li>

        <li><b>建议三：推动企微升级后的数据补齐与权限问题核查，巩固数据可信度。</b>
        推动企微系统管理员尽快补齐6/22之后的数据以还原完整月度口径；同时核实王洁茹(大可)、朱梦娣、王璇的有赞账号权限，
        并复查张胜男4月企微首响342秒的异常会话记录，确保下期月报数据完整、准确，为绩效评估提供更可靠的依据。</li>
      </ul>
